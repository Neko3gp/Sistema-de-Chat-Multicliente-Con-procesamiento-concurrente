<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Chat paralelo</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("chat-theme") || "system";
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          var theme = saved;
          if (saved === "system" || saved === "midnight") {
            theme = light ? "light" : "dark";
          } else if (saved === "uach") {
            theme = light ? "uach-light" : "uach-dark";
          }
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme =
            theme === "light" || theme === "uach-light" ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
